name: Dependency Review

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4.8.2
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
