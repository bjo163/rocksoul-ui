name: Promote dev to main

on:
  workflow_run:
    workflows: ["UI CI"]
    types: [completed]
    branches: [dev]

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-dev-main
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validated_sha: ${{ steps.promote.outputs.validated_sha }}
      ui_run_id: ${{ steps.main_ci.outputs.run_id }}
      ui_run_attempt: ${{ steps.main_ci.outputs.run_attempt }}
      ui_run_url: ${{ steps.main_ci.outputs.run_url }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward exact validated dev head
        id: promote
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --prune origin main dev

          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"

          if [ "$dev_sha" != "$VALIDATED_SHA" ]; then
            echo "dispatch_main_ci=false" >> "$GITHUB_OUTPUT"
            echo "Successful UI CI run is stale: validated=$VALIDATED_SHA current-dev=$dev_sha"
            echo "A newer dev head must pass UI CI before promotion."
            exit 0
          fi

          if [ "$main_sha" = "$dev_sha" ]; then
            echo "main and dev are already synchronized at $dev_sha"
          elif ! git merge-base --is-ancestor "$main_sha" "$dev_sha"; then
            echo "::error::Promotion refused: main ($main_sha) is not an ancestor of validated dev ($dev_sha)."
            echo "::error::Reconcile main into dev and rerun UI CI; no force push will be attempted."
            exit 1
          else
            git checkout --detach "$dev_sha"
            git push origin HEAD:main
          fi

          echo "dispatch_main_ci=true" >> "$GITHUB_OUTPUT"
          echo "validated_sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact main UI CI
        if: steps.promote.outputs.dispatch_main_ci == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main

      - name: Wait for exact main UI CI
        id: main_ci
        if: steps.promote.outputs.dispatch_main_ci == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ steps.promote.outputs.validated_sha }}
        shell: bash
        run: |
          set -euo pipefail
          found_id=""
          found_attempt=""
          found_url=""
          for _ in $(seq 1 30); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=50" --jq '[.workflow_runs[] | select(.name == "UI CI" and .head_sha == "'"$VALIDATED_SHA"'")] | sort_by(.database_id) | reverse | .[0] // empty')"
            if [ -n "$run_json" ]; then
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              found_id="$(jq -r '.id' <<<"$run_json")"
              found_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
              found_url="$(jq -r '.html_url' <<<"$run_json")"
              echo "UI CI run=$found_id sha=$VALIDATED_SHA status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Exact main UI CI failed: run $found_id conclusion=$conclusion"
                  exit 1
                fi
                break
              fi
            fi
            sleep 20
          done

          test -n "$found_id"
          test -n "$found_attempt"
          test -n "$found_url"
          final_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${found_id}")"
          test "$(jq -r '.head_sha' <<<"$final_json")" = "$VALIDATED_SHA"
          test "$(jq -r '.name' <<<"$final_json")" = "UI CI"
          test "$(jq -r '.head_branch' <<<"$final_json")" = "main"
          test "$(jq -r '.status' <<<"$final_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$final_json")" = "success"

          {
            echo "run_id=$found_id"
            echo "run_attempt=$found_attempt"
            echo "run_url=$found_url"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: promote
    if: ${{ needs.promote.outputs.validated_sha != '' && needs.promote.outputs.ui_run_id != '' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/auto-release.yml
    with:
      validated_sha: ${{ needs.promote.outputs.validated_sha }}
      validated_run_id: ${{ needs.promote.outputs.ui_run_id }}
      validated_run_attempt: ${{ needs.promote.outputs.ui_run_attempt }}
      validated_workflow: "UI CI"
      validated_run_url: ${{ needs.promote.outputs.ui_run_url }}
