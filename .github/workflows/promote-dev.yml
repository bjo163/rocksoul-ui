name: Promote dev to main

on:
  workflow_run:
    workflows: ["UI CI"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-main
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Create or reuse dev to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head dev --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head dev --title "chore: promote dev to main" --body "Automated promotion after a successful UI CI run on dev. Main branch CI and dependency-review checks must pass before merge.")"
            pr="${pr##*/}"
          fi
          echo "PR #$pr"
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"

      - name: Wait for PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checks "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --watch --fail-fast

      - name: Squash merge promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch=false
