name: Automatic Release

on:
  workflow_run:
    workflows: ["UI CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact validated main SHA
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          current_sha="$(git rev-parse origin/main)"
          echo "validated_sha=$VALIDATED_SHA"
          echo "current_main_sha=$current_sha"
          if [ "$current_sha" != "$VALIDATED_SHA" ]; then
            echo "::error::Stale release validation: validated=$VALIDATED_SHA current-main=$current_sha"
            exit 1
          fi
          echo "Validated exact main SHA: $VALIDATED_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish already-tagged package release
        id: pending_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(node -p 'require("./package.json").version')"
          tag="v$current"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "No pending GitHub release for $tag."
            else
              gh release create "$tag" --title "@rocksoul/ui $tag" --generate-notes --verify-tag
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Published missing GitHub release for existing tag $tag."
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next release
        id: version
        if: steps.pending_release.outputs.published != 'true'
        shell: bash
        run: node scripts/auto-release.mjs --plan >> "$GITHUB_OUTPUT"

      - name: Apply release version
        if: steps.version.outputs.release == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          node scripts/auto-release.mjs
          npm run build:lib
          npm run audit:repository
          npm run audit:package
          npm run audit:release
          git diff --check
          git diff --exit-code -- dist

      - name: Commit release
        if: steps.version.outputs.release == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md dist
          git commit -m "chore(release): v$NEXT_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: |
          git tag -a "$TAG" -m "@rocksoul/ui $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "@rocksoul/ui $TAG" --generate-notes --verify-tag
