name: Automatic Release

on:
  workflow_dispatch:
    inputs:
      validated_sha:
        description: "Exact main SHA validated by UI CI"
        required: true
        type: string
      validated_run_id:
        description: "Successful UI CI workflow run ID"
        required: true
        type: string
      validated_run_attempt:
        description: "UI CI workflow run attempt"
        required: true
        type: string
      validated_workflow:
        description: "Validated workflow name"
        required: true
        default: "UI CI"
        type: string
      validated_run_url:
        description: "Validated UI CI run URL"
        required: true
        type: string
  workflow_call:
    inputs:
      validated_sha:
        description: "Exact main SHA validated by UI CI"
        required: true
        type: string
      validated_run_id:
        description: "Successful UI CI workflow run ID"
        required: true
        type: string
      validated_run_attempt:
        description: "UI CI workflow run attempt"
        required: true
        type: string
      validated_workflow:
        description: "Validated workflow name"
        required: true
        type: string
      validated_run_url:
        description: "Validated UI CI run URL"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve validation context
        id: validation
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.validated_sha }}
          INPUT_RUN_ID: ${{ inputs.validated_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.validated_run_attempt }}
          INPUT_WORKFLOW: ${{ inputs.validated_workflow }}
          INPUT_RUN_URL: ${{ inputs.validated_run_url }}
        run: |
          set -euo pipefail
          test -n "$INPUT_SHA"
          test -n "$INPUT_RUN_ID"
          test -n "$INPUT_RUN_ATTEMPT"
          test -n "$INPUT_WORKFLOW"
          test -n "$INPUT_RUN_URL"
          {
            echo "sha=$INPUT_SHA"
            echo "run_id=$INPUT_RUN_ID"
            echo "run_attempt=$INPUT_RUN_ATTEMPT"
            echo "workflow=$INPUT_WORKFLOW"
            echo "run_url=$INPUT_RUN_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Verify validated UI CI run
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ steps.validation.outputs.sha }}
          VALIDATED_RUN_ID: ${{ steps.validation.outputs.run_id }}
          VALIDATED_RUN_ATTEMPT: ${{ steps.validation.outputs.run_attempt }}
          VALIDATED_WORKFLOW: ${{ steps.validation.outputs.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATED_RUN_ID}")"
          run_name="$(jq -r '.name' <<<"$run_json")"
          run_branch="$(jq -r '.head_branch' <<<"$run_json")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_status="$(jq -r '.status' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"

          echo "workflow=$run_name"
          echo "branch=$run_branch"
          echo "head_sha=$run_sha"
          echo "status=$run_status"
          echo "conclusion=$run_conclusion"
          echo "run_attempt=$run_attempt"

          test "$run_name" = "$VALIDATED_WORKFLOW"
          test "$run_name" = "UI CI"
          test "$run_branch" = "main"
          test "$run_sha" = "$VALIDATED_SHA"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          test "$run_attempt" = "$VALIDATED_RUN_ATTEMPT"

      - name: Checkout main history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact validated main SHA
        env:
          VALIDATED_SHA: ${{ steps.validation.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          current_sha="$(git rev-parse origin/main)"
          echo "validated_sha=$VALIDATED_SHA"
          echo "current_main_sha=$current_sha"
          if [ "$current_sha" != "$VALIDATED_SHA" ]; then
            echo "::error::Stale release validation: validated=$VALIDATED_SHA current-main=$current_sha"
            exit 1
          fi
          echo "Validated exact main SHA: $VALIDATED_SHA"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish already-tagged package release
        id: pending_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ steps.validation.outputs.sha }}
        run: |
          set -euo pipefail
          current="$(node -p 'require(\"./package.json\").version')"
          tag="v$current"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit_sha="$(git rev-parse "$tag^{commit}")"
            if [ "$tagged_commit_sha" != "$VALIDATED_SHA" ]; then
              if ! git merge-base --is-ancestor "$tagged_commit_sha" "$VALIDATED_SHA"; then
                echo "::error::Existing tag $tag points to unrelated commit $tagged_commit_sha; validated main is $VALIDATED_SHA"
                exit 1
              fi
              echo "Existing tag $tag points to prior release commit $tagged_commit_sha; continuing to calculate the next release from validated main $VALIDATED_SHA."
              echo "published=false" >> "$GITHUB_OUTPUT"
            elif gh release view "$tag" >/dev/null 2>&1; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "No pending GitHub release for $tag."
            else
              gh release create "$tag" --title "@rocksoul/ui $tag" --generate-notes --verify-tag
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "Published missing GitHub release for existing tag $tag."
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next release
        id: version
        if: steps.pending_release.outputs.published != 'true'
        shell: bash
        run: node scripts/auto-release.mjs --plan >> "$GITHUB_OUTPUT"

      - name: Apply release version
        if: steps.version.outputs.release == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          node scripts/auto-release.mjs
          npm run build:lib
          npm run audit:repository
          npm run audit:package
          npm run audit:release
          git diff --check
          git diff --exit-code -- dist

      - name: Commit release
        if: steps.version.outputs.release == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md dist
          git commit -m "chore(release): v$NEXT_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: |
          git tag -a "$TAG" -m "@rocksoul/ui $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "@rocksoul/ui $TAG" --generate-notes --verify-tag

      - name: Resolve released tag
        id: released_tag
        if: steps.version.outputs.release == 'true' || steps.pending_release.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.pending_release.outputs.published }}" = "true" ]; then
            tag="${{ steps.pending_release.outputs.tag }}"
          else
            tag="v${{ steps.version.outputs.next }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag"

      - name: Emit immutable release evidence
        if: steps.version.outputs.release == 'true' || steps.pending_release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.released_tag.outputs.tag }}
          VALIDATED_SHA: ${{ steps.validation.outputs.sha }}
          VALIDATED_RUN_ID: ${{ steps.validation.outputs.run_id }}
          VALIDATED_RUN_ATTEMPT: ${{ steps.validation.outputs.run_attempt }}
          VALIDATED_WORKFLOW: ${{ steps.validation.outputs.workflow }}
          VALIDATED_RUN_URL: ${{ steps.validation.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          tagged_commit_sha="$(git rev-parse "$TAG^{commit}")"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq '.id')"
          package_version="$(node -p 'require(\"./package.json\").version')"
          test "$TAG" = "v$package_version"
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            test "$tagged_commit_sha" != "$VALIDATED_SHA"
          else
            test "$tagged_commit_sha" = "$VALIDATED_SHA"
          fi
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > release-evidence.json <<EOF
          {
            "schema": "rocksoul.release-evidence.v1",
            "repository": "${GITHUB_REPOSITORY}",
            "generatedAt": "${generated_at}",
            "validatedWorkflow": "${VALIDATED_WORKFLOW}",
            "validatedWorkflowRunId": ${VALIDATED_RUN_ID},
            "validatedWorkflowRunAttempt": ${VALIDATED_RUN_ATTEMPT},
            "validatedWorkflowRunUrl": "${VALIDATED_RUN_URL}",
            "validatedSourceSha": "${VALIDATED_SHA}",
            "releaseVersion": "${package_version}",
            "releaseTag": "${TAG}",
            "taggedCommitSha": "${tagged_commit_sha}",
            "githubReleaseId": ${release_id}
          }
          EOF
          jq -e '.schema == "rocksoul.release-evidence.v1" and .validatedSourceSha != "" and .releaseVersion != "" and .releaseTag != "" and .taggedCommitSha != "" and .githubReleaseId > 0' release-evidence.json >/dev/null
          sha256sum release-evidence.json | tee release-evidence.sha256
          gh release upload "$TAG" release-evidence.json release-evidence.sha256

      - name: Upload release evidence artifact
        if: steps.version.outputs.release == 'true' || steps.pending_release.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ steps.released_tag.outputs.tag }}
          path: |
            release-evidence.json
            release-evidence.sha256
