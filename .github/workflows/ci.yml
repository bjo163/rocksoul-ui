name: UI CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install
        run: npm install --no-audit --no-fund
      - name: Design contract audit
        run: npm run audit:tokens
      - name: Accessibility contract audit
        run: npm run audit:a11y
      - name: Research visual contract audit
        run: npm run audit:research-visuals
      - name: Domain contract audit
        run: npm run audit:domains
      - name: Rocksoul assets v2 sync audit
        run: npm run audit:assets-sync

      - name: Rocksoul assets remote freshness
        run: npm run audit:assets-freshness
      - name: MoonWitness asset registry v1.3
        run: npm run audit:assets-registry
      - name: Asset pack byte integrity
        run: npm run audit:assets-integrity
      - name: Platform/Admin contract audit
        run: npm run audit:platform-admin
      - name: Application framework audit
        run: npm run audit:application
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build consumable library
        run: npm run build:lib
      - name: Package artifact audit
        run: npm run audit:package
      - name: Consumer package smoke
        run: npm run test:consumer
      - name: Release closure audit
        run: npm run audit:release
      - name: Build playground
        run: npm run build:playground
      - name: Build Storybook
        run: npm run build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility + responsive QA
        run: npm run test:browser
