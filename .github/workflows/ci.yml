name: UI CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Design contract audit
        run: npm run audit:tokens

      - name: Accessibility contract audit
        run: npm run audit:a11y

      - name: Typecheck
        run: npm run typecheck

      - name: Build playground
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
