name: ROCKSOUL Task
description: Track an atomic repository task with executable acceptance criteria
title: "TASK: "
labels:
  - task
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: Unique stable task identifier.
      placeholder: UI-CONTRACT-001
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: repository / package / ci / assets / runtime
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Must be executable, deterministic, and evidence-producing. Unknown state must fail closed.
      placeholder: |
        - [ ] npm run audit:repository passes
        - [ ] affected tests pass
        - [ ] clean git status
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: Exact logs, files, tests, screenshots, or commit references proving completion.
    validations:
      required: true
  - type: textarea
    id: affected-paths
    attributes:
      label: Affected paths
      description: Source, generated, contract, CI, and documentation paths touched by the task.
    validations:
      required: true
